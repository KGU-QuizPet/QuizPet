<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizPet 데스크탑 UI 디자인 v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9; --surface:#FFFFFF; --sunken:#FBEFD9; --line:#EBDDC5; --shadow:#E6D5B8;
  --ink:#2B2440; --ink2:#6E6787; --ink3:#A49DB5;
  --brand:#FF8A00; --brandDark:#D96F00; --brandSoft:#FFF0DC;
  --exp:#FFC233; --expDark:#E09A00;
  --ok:#12B76A; --okDark:#0B8A4F; --okSoft:#E3F8EE;
  --err:#F04438; --errDark:#C42B20; --errSoft:#FDE8E7;
  --int:#3D8BFD; --str:#E8467C; --foc:#8B5CF6; --wis:#10A37F; --common:#06B6D4;
  --dark:#2B2440;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EFE7DA;color:var(--ink);font-family:'Noto Sans KR',sans-serif;}
.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}

/* ---------- 문서 레이아웃 ---------- */
.doc{max-width:1400px;margin:0 auto;padding:40px 32px 80px}
.doc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}
.doc-head h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:44px;line-height:1.1}
.doc-head p{color:var(--ink2);font-size:15px;margin-top:8px;max-width:760px;line-height:1.6}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 36px}
.toc a{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px}
.toc a:hover{border-color:var(--brand);color:var(--brandDark)}
.sec{margin:0 0 56px;scroll-margin-top:20px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.sec-h .id{font-family:'Jua','Noto Sans KR',sans-serif;color:var(--brandDark);font-size:18px}
.sec-h h2{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:28px}
.sec-desc{color:var(--ink2);font-size:14px;line-height:1.6;margin-bottom:16px;max-width:1000px}
.frame-wrap{width:100%;position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px #d9ccb6,0 10px 30px rgba(43,36,64,.12)}
.frame-scale{transform-origin:0 0;width:1280px;height:800px}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.note{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--ink2)}
.note b{color:var(--ink);display:block;margin-bottom:4px;font-size:13px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--sunken);padding:1px 5px;border-radius:5px;color:var(--ink)}

/* ---------- 디자인 시스템 시트 ---------- */
.ds{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ds-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 4px 0 var(--shadow)}
.ds-card h3{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:20px;margin-bottom:14px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border-radius:12px;overflow:hidden;border:2px solid var(--line);font-size:11px}
.sw i{display:block;height:46px}
.sw span{display:block;padding:6px 8px;line-height:1.35;color:var(--ink2)}
.sw span b{color:var(--ink);font-size:12px}
.typo-row{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px dashed var(--line)}
.typo-row:last-child{border:0}
.typo-row small{width:150px;flex:none;color:var(--ink3);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.comp-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
pre{background:var(--dark);color:#F6EFFF;border-radius:14px;padding:16px 18px;font-size:12px;line-height:1.6;overflow:auto;font-family:ui-monospace,Menlo,monospace}
pre .c{color:#A49DB5}
pre .k{color:#FFC233}
.tree{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;color:var(--ink2);white-space:pre}

/* ---------- 앱 프레임 (Swing 대응) ---------- */
.frame{width:1280px;height:800px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;font-size:15px}
.topbar{height:64px;flex:none;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Jua','Noto Sans KR',sans-serif;font-size:26px;color:var(--ink);width:272px}
.logo .paw{width:36px;height:36px;border-radius:12px;background:var(--brand);display:grid;place-items:center;box-shadow:0 3px 0 var(--brandDark)}
.tabs{display:flex;gap:6px;flex:1}
.tab{height:40px;padding:0 18px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink2)}
.tab.on{background:var(--brandSoft);color:var(--brandDark)}
.tab.dis{color:var(--ink3)}
.userchip{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;border:2px solid var(--line);border-radius:999px;font-size:14px;font-weight:700}
.userchip .av{width:30px;height:30px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;overflow:hidden}
.userchip .sw-user{font-size:12px;color:var(--ink2);font-weight:500;border-left:1px solid var(--line);padding-left:10px;margin-right:6px}
.app-body{flex:1;display:flex;min-height:0}
.sidebar{width:320px;flex:none;background:#fff;border-right:2px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
.content{flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:20px;min-width:0}

/* 펫 스테이지 */
.stage{height:276px;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(180deg,#FFF3DE 0%,#FFE7C2 100%);border:2px solid var(--line)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:58px;background:#F7D9A8}
.stage .shadow{position:absolute;left:50%;bottom:30px;width:120px;height:18px;margin-left:-60px;border-radius:50%;background:rgba(150,100,40,.22)}
.stage .petimg{position:absolute;left:50%;bottom:30px;transform:translateX(-50%)}
.bubble{position:absolute;top:14px;right:12px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 11px;font-size:13px;font-weight:700;max-width:170px;line-height:1.35}
.bubble:after{content:"";position:absolute;left:22px;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.moodtag{position:absolute;left:12px;top:14px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.85);border:2px solid var(--line)}
.pet-name{display:flex;align-items:center;justify-content:space-between}
.pet-name .n{font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px}
.pet-name .kind{font-size:12px;color:var(--ink3);margin-left:6px;font-family:'Noto Sans KR'}
.lv{font-family:'Jua','Noto Sans KR',sans-serif;font-size:16px;background:var(--dark);color:#fff;border-radius:10px;padding:3px 10px}
.lv.big{font-size:22px;padding:4px 14px}
.bar{height:14px;border-radius:999px;background:var(--sunken);border:2px solid var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px}
.bar.exp i{background:var(--exp);box-shadow:inset 0 -3px 0 var(--expDark)}
.bar .gain{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#FFE08A 0 6px,#FFD15C 6px 12px)}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-weight:700;margin-top:5px}
.stats{display:flex;flex-direction:column;gap:12px}
.stat{display:grid;grid-template-columns:54px 34px 1fr 40px;align-items:center;gap:10px}
.stat .chip{font-size:11px;font-weight:900;color:#fff;border-radius:8px;text-align:center;padding:4px 0;letter-spacing:.5px}
.stat .bar{height:10px;border-width:0;background:#F3EADB}
.stat .v{font-family:'Jua','Noto Sans KR',sans-serif;font-size:17px;text-align:right}
.stat .plus{color:var(--ok);font-size:12px;font-family:'Noto Sans KR';font-weight:900;margin-left:2px}
.side-title{font-size:12px;font-weight:900;color:var(--ink3);letter-spacing:1px}
.mini{margin-top:auto;background:var(--sunken);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.mini .k{font-size:12px;color:var(--ink2);font-weight:700}
.mini .val{font-family:'Jua','Noto Sans KR',sans-serif;font-size:20px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.dots i.o{background:var(--ok);border-color:var(--okDark)}
.dots i.x{background:var(--err);border-color:var(--errDark)}
.dots i.cur{border-color:var(--brand);border-width:3px}

/* 공통 컴포넌트 */
.card{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--shadow)}
.btn{height:52px;padding:0 26px;border-radius:14px;font-weight:900;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;white-space:nowrap;cursor:default}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brandDark)}
.btn.dark{background:var(--dark);color:#fff;box-shadow:0 4px 0 #120E20}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--shadow)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--okDark)}
.btn.disabled{background:#EFE6D6;color:var(--ink3);box-shadow:0 4px 0 #E1D4BE}
.btn.sm{height:40px;font-size:14px;padding:0 16px;border-radius:12px}
.btn.lg{height:60px;font-size:18px;padding:0 34px}
.chipx{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--sunken);color:var(--ink2)}
.h1{font-family:'Jua','Noto Sans KR',sans-serif;font-size:32px;line-height:1.15}
.h2{font-family:'Jua','Noto Sans KR',sans-serif;font-size:22px}
.sub{color:var(--ink2);font-size:15px}
.input{height:52px;border:2px solid var(--line);border-radius:14px;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:16px;color:var(--ink3)}
.input.focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brandSoft);color:var(--ink)}
.input .caret{width:2px;height:22px;background:var(--brand);margin-left:2px}
.label{font-size:13px;font-weight:900;color:var(--ink2);margin-bottom:8px}
.row{display:flex;gap:16px;align-items:center}
.spacer{flex:1}

/* Shell A (시작/생성) */
.auth{display:flex;height:100%}
.hero{width:560px;flex:none;background:var(--brand);position:relative;overflow:hidden;color:#fff;padding:56px 52px;display:flex;flex-direction:column}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .ttl{font-family:'Jua','Noto Sans KR',sans-serif;font-size:72px;line-height:1;text-shadow:0 5px 0 var(--brandDark)}
.hero .tag{font-size:19px;font-weight:700;margin-top:14px;opacity:.95}
.hero .ground{position:absolute;left:0;right:0;bottom:0;height:150px;background:#FFB44D;border-top:4px solid #FFC978}
.auth-main{flex:1;padding:48px 72px;display:flex;flex-direction:column;justify-content:center;gap:22px;overflow:hidden}
.user-row{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--shadow)}
.user-row.sel{border-color:var(--brand);box-shadow:0 3px 0 var(--brandDark);background:#FFFAF2}
.user-row .av{width:52px;height:52px;border-radius:14px;background:var(--sunken);display:grid;place-items:center;overflow:hidden;flex:none}
.user-row .nm{font-weight:900;font-size:17px}
.user-row .ds2{font-size:13px;color:var(--ink2)}
.divider{display:flex;align-items:center;gap:14px;color:var(--ink3);font-size:13px;font-weight:700}
.divider:before,.divider:after{content:"";flex:1;height:2px;background:var(--line)}
.pick{flex:1;border:2px solid var(--line);border-radius:18px;background:#fff;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--shadow);position:relative}
.pick.sel{border-color:var(--brand);box-shadow:0 4px 0 var(--brandDark);background:#FFFAF2}
.pick .check{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.pick b{font-size:16px}
.pick small{font-size:12px;color:var(--ink3)}

/* 카테고리 */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:20px;flex:1}
.cat{border-radius:22px;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--shadow);padding:22px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.cat.hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--c);border-color:var(--c)}
.cat .ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--cs)}
.cat .nm{font-family:'Jua','Noto Sans KR',sans-serif;font-size:28px;margin-top:16px;display:flex;align-items:center;gap:10px}
.cat .stc{font-family:'Noto Sans KR';font-size:12px;font-weight:900;color:#fff;background:var(--c);border-radius:8px;padding:3px 8px}
.cat .ds3{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5}
.cat .foot{margin-top:auto;display:flex;align-items:center;gap:12px}
.cat .foot .bar{flex:1;height:10px;border:0;background:#F3EADB}
.cat .foot .bar i{background:var(--c)}
.cat .foot span{font-size:13px;font-weight:900;color:var(--ink2);white-space:nowrap}
.cat .deco{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--cs);opacity:.6}

/* 학습 카드 */
.lcard{flex:1;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--shadow);display:flex;overflow:hidden}
.lcard .side{width:10px;background:var(--int)}
.lcard .in{flex:1;padding:40px 52px;display:flex;flex-direction:column}
.progress-seg{display:flex;gap:6px}
.progress-seg i{flex:1;height:8px;border-radius:999px;background:#F3EADB}
.progress-seg i.done{background:var(--int)}
.progress-seg i.cur{background:var(--brand)}

/* 퀴즈 */
.qhead{display:flex;align-items:center;gap:14px}
.qbox{background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--shadow);padding:36px 44px}
.qnum{font-family:'Jua','Noto Sans KR',sans-serif;color:var(--brandDark);font-size:20px}
.qtext{font-family:'Jua','Noto Sans KR',sans-serif;font-size:34px;line-height:1.35;margin-top:8px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1}
.oxbtn{border-radius:26px;background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.oxbtn .sym{font-family:'Jua','Noto Sans KR',sans-serif;font-size:150px;line-height:1}
.oxbtn .cap{font-weight:900;color:var(--ink2);font-size:16px}
.oxbtn.o .sym{color:var(--int)}
.oxbtn.x .sym{color:var(--err)}
.oxbtn.o.sel{border-color:var(--int);background:#EEF5FF;box-shadow:0 6px 0 #2A6BD1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1}
.opt{border-radius:20px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--shadow);display:flex;align-items:center;gap:18px;padding:0 26px;font-size:22px;font-weight:700}
.opt .no{width:46px;height:46px;border-radius:14px;background:var(--sunken);display:grid;place-items:center;font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;color:var(--ink2);flex:none}
.opt.sel{border-color:var(--brand);background:#FFF7EB;box-shadow:0 5px 0 var(--brandDark)}
.opt.sel .no{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okSoft);box-shadow:0 5px 0 var(--okDark)}
.opt.right .no{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--errSoft);box-shadow:0 5px 0 var(--errDark)}
.opt.wrong .no{background:var(--err);color:#fff}
.opt .tag{margin-left:auto;font-size:13px;font-weight:900;padding:4px 10px;border-radius:999px}
.actionbar{display:flex;align-items:center;gap:14px}

/* 피드백 패널 */
.fb{border-radius:22px;padding:22px 26px;display:flex;gap:20px;align-items:flex-start;border:3px solid}
.fb.ok{background:var(--okSoft);border-color:var(--ok)}
.fb.no{background:var(--errSoft);border-color:var(--err)}
.fb .badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;flex:none;font-family:'Jua','Noto Sans KR',sans-serif;font-size:40px;color:#fff}
.fb.ok .badge{background:var(--ok);box-shadow:0 4px 0 var(--okDark)}
.fb.no .badge{background:var(--err);box-shadow:0 4px 0 var(--errDark)}
.fb .t{font-family:'Jua','Noto Sans KR',sans-serif;font-size:28px}
.fb.ok .t{color:var(--okDark)} .fb.no .t{color:var(--errDark)}
.fb p{font-size:16px;line-height:1.6;margin-top:4px;color:var(--ink)}
.reward{display:flex;gap:10px;margin-top:12px}
.reward span{font-weight:900;font-size:14px;padding:6px 12px;border-radius:10px;background:#fff;border:2px solid var(--line)}

/* 결과 */
.ring{width:168px;height:168px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring .inner{width:130px;height:130px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kpi{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--shadow);padding:16px 18px}
.kpi .k{font-size:13px;color:var(--ink2);font-weight:700}
.kpi .v{font-family:'Jua','Noto Sans KR',sans-serif;font-size:34px;margin-top:2px}
.kpi .v small{font-size:16px;color:var(--ink3)}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--sunken);font-size:14px}
.qitem .r{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;flex:none}
.qitem .xp{margin-left:auto;font-weight:900;font-size:13px;color:var(--expDark);white-space:nowrap}
.lvup{background:var(--dark);color:#fff;border-radius:20px;padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 0 #120E20}

/* 기록 */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--ink3);font-weight:900;padding:10px 14px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px 14px;white-space:nowrap;border-bottom:1px solid #F3EADB}
.pill{font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.seg{display:flex;background:var(--sunken);border-radius:12px;padding:4px;gap:4px}
.seg span{font-size:13px;font-weight:700;padding:6px 14px;border-radius:9px;color:var(--ink2)}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--shadow)}
.catbar{display:grid;grid-template-columns:80px 1fr 56px;gap:14px;align-items:center}
.catbar .bar{height:18px;border:0;background:#F3EADB}
.wnote{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff}
.wnote.sel{border-color:var(--brand);background:#FFFAF2}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
.cb.on{background:var(--brand);border-color:var(--brandDark)}
.confetti i{position:absolute;width:10px;height:14px;border-radius:3px}
@media (max-width:900px){.ds{grid-template-columns:1fr}.notes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="doc">
  <div class="doc-head">
    <div>
      <h1>QuizPet 데스크탑 UI 디자인 v2.0</h1>

<script>
/* ================= 펫 일러스트 (원본 디자인, 실제 앱에선 PNG로 교체) ================= */
const PET = {
  DUCK:  {label:'고라파카', body:'#FFD54F', dark:'#E9B21F', belly:'#FFF1B8'},
  TURTLE:{label:'고북이',   body:'#8EDB9B', dark:'#4FA866', belly:'#E9F8E4', shell:'#5BAF6E'},
  LIZARD:{label:'파이리',   body:'#F7A28B', dark:'#D9735A', belly:'#FFE3D6'}
};
function face(cx, cy, mood, s=1){
  const e = 15*s, ey = cy;
  let eyes='', mouth='', extra='';
  const eyeL = cx-e, eyeR = cx+e;
  const star=(x,y,r)=>{let pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;pts.push((x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1));}return `<polygon points="${pts.join(' ')}" fill="#FFC233" stroke="#2B2440" stroke-width="2.5" stroke-linejoin="round"/>`;};
  if(mood==='levelup'){
    eyes = star(eyeL,ey,11)+star(eyeR,ey,11);
  } else if(mood==='happy'){
    eyes = `<path d="M${eyeL-6} ${ey+2} Q${eyeL} ${ey-7} ${eyeL+6} ${ey+2}" stroke="#2B2440" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M${eyeR-6} ${ey+2} Q${eyeR} ${ey-7} ${eyeR+6} ${ey+2}" stroke="#2B2440" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  } else {
    eyes = `<circle cx="${eyeL}" cy="${ey}" r="6.5" fill="#2B2440"/><circle cx="${eyeR}" cy="${ey}" r="6.5" fill="#2B2440"/>
            <circle cx="${eyeL+2}" cy="${ey-2.5}" r="2.2" fill="#fff"/><circle cx="${eyeR+2}" cy="${ey-2.5}" r="2.2" fill="#fff"/>`;
  }
  if(mood==='focus'){
    extra += `<path d="M${eyeL-8} ${ey-13} L${eyeL+5} ${ey-10}" stroke="#2B2440" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M${eyeR+8} ${ey-13} L${eyeR-5} ${ey-10}" stroke="#2B2440" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  if(mood==='sad'){
    extra += `<path d="M${eyeL-8} ${ey-10} L${eyeL+5} ${ey-14}" stroke="#2B2440" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M${eyeR+8} ${ey-10} L${eyeR-5} ${ey-14}" stroke="#2B2440" stroke-width="3.5" stroke-linecap="round"/>
`;
  }
  extra += `<ellipse cx="${eyeL-9}" cy="${ey+12}" rx="7" ry="4.5" fill="#FF8FA3" opacity=".55"/><ellipse cx="${eyeR+9}" cy="${ey+12}" rx="7" ry="4.5" fill="#FF8FA3" opacity=".55"/>`;
  if(mood==='sad') extra += `<path d="M${eyeR+3} ${ey+5} C${eyeR+12} ${ey+17} ${eyeR+12} ${ey+25} ${eyeR+5} ${ey+26} C${eyeR-2} ${ey+25} ${eyeR-3} ${ey+17} ${eyeR+3} ${ey+5}Z" fill="#5AA9FF" stroke="#2B7BD6" stroke-width="1.5"/><circle cx="${eyeR+3}" cy="${ey+19}" r="2" fill="#fff"/>`;
  const my = ey+16;
  if(mood==='happy'||mood==='levelup') mouth = `<path d="M${cx-8} ${my-2} Q${cx} ${my+10} ${cx+8} ${my-2} Z" fill="#B23A48"/>`;
  else if(mood==='sad') mouth = `<path d="M${cx-6} ${my+4} Q${cx} ${my-3} ${cx+6} ${my+4}" stroke="#2B2440" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else if(mood==='focus') mouth = `<path d="M${cx-5} ${my+1} L${cx+5} ${my+1}" stroke="#2B2440" stroke-width="3.5" stroke-linecap="round"/>`;
  else mouth = `<path d="M${cx-6} ${my} Q${cx} ${my+6} ${cx+6} ${my}" stroke="#2B2440" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  return {eyes, mouth, extra};
}
function pet(kind='DUCK', mood='idle', size=160){
  const p = PET[kind]; let g='';
  if(kind==='DUCK'){
    const f = face(100,92,mood);
    g = `<ellipse cx="78" cy="182" rx="16" ry="7" fill="#FF9F43"/><ellipse cx="122" cy="182" rx="16" ry="7" fill="#FF9F43"/>
      <ellipse cx="100" cy="118" rx="66" ry="64" fill="${p.body}"/>
      <ellipse cx="100" cy="140" rx="40" ry="34" fill="${p.belly}"/>
      <ellipse cx="38" cy="128" rx="14" ry="24" fill="${p.dark}" transform="rotate(${mood==='happy'||mood==='levelup'?-35:20} 38 128)"/>
      <ellipse cx="162" cy="128" rx="14" ry="24" fill="${p.dark}" transform="rotate(${mood==='happy'||mood==='levelup'?35:-20} 162 128)"/>
      ${f.extra}${f.eyes}
      <ellipse cx="100" cy="${mood==='happy'||mood==='levelup'?112:110}" rx="20" ry="${mood==='happy'||mood==='levelup'?11:8}" fill="#FF8A3D"/>
      <path d="M82 110 Q100 ${mood==='sad'?104:116} 118 110" stroke="#D9622B" stroke-width="2.5" fill="none"/>`;
  } else if(kind==='TURTLE'){
    const f = face(100,78,mood);
    g = `<ellipse cx="60" cy="176" rx="17" ry="11" fill="${p.body}"/><ellipse cx="140" cy="176" rx="17" ry="11" fill="${p.body}"/>
      <path d="M30 160 Q30 92 100 92 Q170 92 170 160 Z" fill="${p.shell}"/>
      <path d="M30 160 Q100 172 170 160" stroke="${p.dark}" stroke-width="6" fill="none"/>
      <polygon points="100,108 118,120 118,140 100,150 82,140 82,120" fill="#7CCB8A"/>
      <polygon points="60,128 74,136 74,152 60,156 46,150 48,134" fill="#7CCB8A"/>
      <polygon points="140,128 154,134 152,150 140,156 126,152 126,136" fill="#7CCB8A"/>
      <circle cx="100" cy="78" r="48" fill="${p.body}"/>
      <ellipse cx="100" cy="98" rx="28" ry="16" fill="${p.belly}"/>
      ${f.extra}${f.eyes}${f.mouth}`;
  } else {
    const f = face(100,86,mood);
    g = `<path d="M150 160 Q190 160 186 128 Q184 112 172 116" stroke="${p.body}" stroke-width="16" fill="none" stroke-linecap="round"/>
      <ellipse cx="74" cy="180" rx="15" ry="8" fill="${p.dark}"/><ellipse cx="126" cy="180" rx="15" ry="8" fill="${p.dark}"/>
      <ellipse cx="100" cy="148" rx="48" ry="36" fill="${p.body}"/>
      <ellipse cx="100" cy="154" rx="28" ry="24" fill="${p.belly}"/>
      <ellipse cx="100" cy="86" rx="56" ry="48" fill="${p.body}"/>
      <circle cx="70" cy="56" r="6" fill="${p.dark}" opacity=".5"/><circle cx="132" cy="60" r="5" fill="${p.dark}" opacity=".5"/><circle cx="118" cy="46" r="4" fill="${p.dark}" opacity=".5"/>
      <ellipse cx="54" cy="${mood==='happy'||mood==='levelup'?128:146}" rx="11" ry="16" fill="${p.dark}" transform="rotate(${mood==='happy'||mood==='levelup'?-30:15} 54 140)"/>
      <ellipse cx="146" cy="${mood==='happy'||mood==='levelup'?128:146}" rx="11" ry="16" fill="${p.dark}" transform="rotate(${mood==='happy'||mood==='levelup'?30:-15} 146 140)"/>
      ${f.extra}${f.eyes}${f.mouth}`;
  }
  let spark = '', aura = '';
  if(mood==='levelup'){
    aura = `<circle cx="100" cy="112" r="88" fill="#FFE27A" opacity=".35"/><circle cx="100" cy="112" r="88" fill="none" stroke="#FFC233" stroke-width="3" stroke-dasharray="6 9" opacity=".8"/>`;
    spark = `<path d="M22 46 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#FFC233" stroke="#E09A00" stroke-width="1.5"/><path d="M172 24 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#FFC233" stroke="#E09A00" stroke-width="1.5"/><path d="M180 150 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3z" fill="#FFC233"/>
      <g fill="#12B76A" stroke="#0B8A4F" stroke-width="1.5"><path d="M18 150 l10 -12 10 12 h-6 v12 h-8 v-12z"/></g>`;
  } else if(mood==='happy'){
    spark = `<path d="M24 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFC233"/><path d="M172 28 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#FFC233"/>`;
  }
  if(mood==='focus') spark = `<path d="M156 44 C150 56 150 64 157 66 C164 64 164 56 156 44Z" fill="#8EC5FF" stroke="#4E9BEA" stroke-width="1.5"/><path d="M170 74 l12 -3 M168 86 l13 1" stroke="#A49DB5" stroke-width="3" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${aura}${g}${spark}</svg>`;
}

const ICON = {
  sword:c=>`<svg width="18" height="18" viewBox="0 0 24 24"><path d="M14.5 3H21v6.5L10 20.5 3.5 14z" fill="${c}"/><path d="M5 15l4 4-2 2-1.5-1.5L3 22l-1-1 2.5-2.5L3 17z" fill="${c}"/></svg>`,
  paw:`<svg width="22" height="22" viewBox="0 0 24 24"><g fill="#fff"><ellipse cx="12" cy="16" rx="5.5" ry="4.5"/><circle cx="5.5" cy="10" r="2.4"/><circle cx="18.5" cy="10" r="2.4"/><circle cx="9" cy="5.5" r="2.4"/><circle cx="15" cy="5.5" r="2.4"/></g></svg>`,
  home:c=>`<svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="${c}"/></svg>`,

  chart:c=>`<svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1.5" fill="${c}"/><rect x="10" y="6" width="4" height="15" rx="1.5" fill="${c}"/><rect x="17" y="3" width="4" height="18" rx="1.5" fill="${c}"/></svg>`,
  note:c=>`<svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="${c}"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
  science:c=>`<svg width="40" height="40" viewBox="0 0 40 40"><path d="M15 5h10M17 5v10L8 31a3 3 0 0 0 3 4h18a3 3 0 0 0 3-4l-9-16V5" stroke="${c}" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M11.5 25h17l3 6a2 2 0 0 1-2 3H10.5a2 2 0 0 1-2-3z" fill="${c}"/><circle cx="20" cy="20" r="2" fill="${c}"/></svg>`,
  common:c=>`<svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 5a11 11 0 0 0-6 20v4h12v-4a11 11 0 0 0-6-20z" fill="${c}"/><rect x="14" y="31" width="12" height="4" rx="2" fill="${c}"/><path d="M17 17l3 3 3-3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
  sports:c=>`<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="${c}"/><path d="M8 14q12 6 24 0M8 26q12-6 24 0M20 6v28" stroke="#fff" stroke-width="2.5" fill="none"/></svg>`,
  language:c=>`<svg width="40" height="40" viewBox="0 0 40 40"><rect x="4" y="7" width="32" height="22" rx="7" fill="${c}"/><path d="M12 35l4-6h-6z" fill="${c}"/><text x="20" y="24" text-anchor="middle" font-family="Jua" font-size="15" fill="#fff">Aa</text></svg>`,
  history:c=>`<svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 4 4 12h32z" fill="${c}"/><rect x="7" y="14" width="4" height="15" fill="${c}"/><rect x="15" y="14" width="4" height="15" fill="${c}"/><rect x="21" y="14" width="4" height="15" fill="${c}"/><rect x="29" y="14" width="4" height="15" fill="${c}"/><rect x="4" y="31" width="32" height="5" rx="2" fill="${c}"/></svg>`
};
const CAT = [
  {id:'SCIENCE', nm:'과학', stat:'INT', c:'#3D8BFD', cs:'#E4EFFF', icon:'science', ds:'자연 현상과 과학 원리를 배웁니다', acc:80, solved:15},
  {id:'COMMON', nm:'상식', stat:'INT', c:'#06B6D4', cs:'#DDF6FA', icon:'common', ds:'생활상식들을 배웁니다', acc:62, solved:8},
  {id:'SPORTS', nm:'스포츠', stat:'STR', c:'#E8467C', cs:'#FDE4EC', icon:'sports', ds:'운동, 건강과 관련된 지식들을 배웁니다', acc:70, solved:10},
  {id:'LANGUAGE', nm:'언어', stat:'FOC', c:'#8B5CF6', cs:'#EEE7FF', icon:'language', ds:'영어 문법과 어휘(단어)를 배웁니다', acc:50, solved:6},
  {id:'HISTORY', nm:'역사', stat:'WIS', c:'#10A37F', cs:'#DFF5EE', icon:'history', ds:'한국사의 주요 사건과 기록들을 배웁니다', acc:0, solved:0}
];
const STAT = [['INT','지성','--int'],['STR','체력','--str'],['FOC','집중','--foc'],['WIS','지혜','--wis']];

/* ================= 공통 셸 ================= */
function topbar(active){
  const t = [['home','홈'],['book','학습하기'],['chart','학습 기록'],['note','오답노트'],['sword','보스 결투']];
  return `<div class="topbar">
    <div class="logo"><div class="paw">${ICON.paw}</div>QuizPet</div>
    <div class="tabs">${t.map(([ic,nm],i)=>{
      const on = i===active; const col = on?'#D96F00':'#A49DB5';
      return `<div class="tab ${on?'on':''}">${ICON[ic](col)}${nm}</div>`;}).join('')}</div>
    <div class="userchip"><div class="av">${pet('DUCK','idle',30)}</div>석민 <span class="sw-user">사용자 변경</span></div>
  </div>`;
}
const defaultPet = {name:'말랑이', kind:'DUCK', lv:4, xp:30, max:50, stats:{INT:18,STR:12,FOC:14,WIS:13}};
const moodLabel = {idle:'😊 평온', focus:'🔥 집중', happy:'🎉 신남', sad:'💧 아쉬움', levelup:'⭐ 레벨 업'};
function sidebar(o={}){
  const p = Object.assign({}, defaultPet, o.pet||{});
  const mood = o.mood||'idle';
  const gain = o.gain||0; const plus = o.plus||{};
  const xpPct = p.xp/p.max*100, gainPct = gain/p.max*100;
  return `<aside class="sidebar">
    <div class="stage">
      <div class="floor"></div><div class="shadow"></div>
      <div class="petimg">${pet(p.kind,mood,196)}</div>
      <div class="moodtag">${moodLabel[mood].replace(/^\S+ /,'')}</div>
      <div class="bubble">${o.say||'오늘도 같이 공부하자!'}</div>
    </div>
    <div class="pet-name"><div><span class="n">${p.name}</span><span class="kind">${PET[p.kind].label}</span></div><span class="lv ${o.lvBig?'big':''}">Lv.${p.lv}</span></div>
    <div>
      <div class="bar exp"><i style="width:${xpPct}%"></i>${gain?`<span class="gain" style="left:${xpPct-gainPct}%;width:${gainPct}%"></span>`:''}</div>
      <div class="bar-meta"><span>EXP ${p.xp} / ${p.max}</span><span>${gain?`<span style="color:var(--okDark)">+${gain} EXP</span>`:`다음 레벨까지 ${p.max-p.xp}`}</span></div>
    </div>
    <div class="side-title">능력치</div>
    <div class="stats">${STAT.map(([k,nm,v])=>`<div class="stat"><span class="chip" style="background:var(${v})">${k}</span><span style="font-size:12px;font-weight:700;color:var(--ink2)">${nm}</span>
      <div class="bar"><i style="width:${p.stats[k]/30*100}%;background:var(${v})"></i></div>
      <span class="v">${p.stats[k]}${plus[k]?`<span class="plus">+${plus[k]}</span>`:''}</span></div>`).join('')}</div>
    ${o.mini||`<div class="mini"><div><div class="k">누적 정답률</div><div class="val">68.4%</div></div><div style="text-align:right"><div class="k">푼 문제</div><div class="val">39</div></div></div>`}
  </aside>`;
}
function sessionMini(states){
  const solved = states.filter(s=>s==='o'||s==='x').length, ok = states.filter(s=>s==='o').length;
  return `<div class="mini"><div><div class="k">이번 퀴즈</div><div class="val">${ok} / ${solved} 정답</div></div><div class="dots">${states.map(s=>`<i class="${s}"></i>`).join('')}</div></div>`;
}
function game(tab, side, content){
  return `<div class="frame">${topbar(tab)}<div class="app-body">${sidebar(side)}<main class="content">${content}</main></div></div>`;
}
function catChip(c){return `<span class="chipx" style="background:${c.cs};color:${c.c}">${ICON[c.icon](c.c).replace(/width="40" height="40"/,'width="18" height="18"')} ${c.nm} · ${c.stat}</span>`}

function bossFace(cx, cy, st, o={}){
  const e = o.gap||22, L = cx-e, R = cx+e, ink = '#2B2440'; let s = '';
  if(st==='defeated'){
    const X = x=>`<path d="M${x-8} ${cy-8} L${x+8} ${cy+8} M${x+8} ${cy-8} L${x-8} ${cy+8}" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>`;
    s += X(L)+X(R);
    s += `<path d="M${cx-13} ${cy+22} Q${cx} ${cy+15} ${cx+13} ${cy+22}" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M${cx+1} ${cy+20} q6 13 13 0" fill="#FF8FA8" stroke="${ink}" stroke-width="2.5"/>`;
  } else if(st==='hurt'){
    s += `<path d="M${L-9} ${cy-9} L${L+7} ${cy} L${L-9} ${cy+9}" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M${R+9} ${cy-9} L${R-7} ${cy} L${R+9} ${cy+9}" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M${cx-15} ${cy+24} l7.5 -6 l7.5 6 l7.5 -6 l7.5 6" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M${R+24} ${cy-26} C${R+17} ${cy-14} ${R+18} ${cy-6} ${R+24} ${cy-5} C${R+30} ${cy-6} ${R+31} ${cy-14} ${R+24} ${cy-26}Z" fill="#8EC5FF" stroke="#4E9BEA" stroke-width="1.5"/>`;
  } else if(st==='attack'){
    s += `<path d="M${L-15} ${cy-20} L${L+10} ${cy-9}" stroke="${ink}" stroke-width="6" stroke-linecap="round"/>
          <path d="M${R+15} ${cy-20} L${R-10} ${cy-9}" stroke="${ink}" stroke-width="6" stroke-linecap="round"/>`;
    if(o.glow) s += `<rect x="${L-11}" y="${cy-5}" width="22" height="10" rx="5" fill="#FF6B3D"/><rect x="${R-11}" y="${cy-5}" width="22" height="10" rx="5" fill="#FF6B3D"/>`;
    else s += `<ellipse cx="${L}" cy="${cy}" rx="11" ry="8" fill="#fff" stroke="${ink}" stroke-width="3"/><ellipse cx="${R}" cy="${cy}" rx="11" ry="8" fill="#fff" stroke="${ink}" stroke-width="3"/>
               <circle cx="${L+4}" cy="${cy+1}" r="4.5" fill="${ink}"/><circle cx="${R-4}" cy="${cy+1}" r="4.5" fill="${ink}"/>`;
    s += `<path d="M${cx-21} ${cy+15} Q${cx} ${cy+46} ${cx+21} ${cy+15} Z" fill="#7A1F3D" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
          <path d="M${cx-15} ${cy+16} l5 8 l5 -8 Z M${cx+5} ${cy+16} l5 8 l5 -8 Z" fill="#fff"/>`;
  } else {
    if(o.sleepy){
      s += `<path d="M${L-12} ${cy} Q${L} ${cy+8} ${L+12} ${cy}" stroke="${ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            <path d="M${R-12} ${cy} Q${R} ${cy+8} ${R+12} ${cy}" stroke="${ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="${cx}" cy="${cy+22}" rx="6" ry="7" fill="#7A1F3D"/>`;
    } else if(o.glow){
      s += `<rect x="${L-11}" y="${cy-6}" width="22" height="12" rx="6" fill="#FFD34D"/><rect x="${R-11}" y="${cy-6}" width="22" height="12" rx="6" fill="#FFD34D"/>
            <path d="M${cx-12} ${cy+22} L${cx+12} ${cy+22}" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
    } else {
      s += `<ellipse cx="${L}" cy="${cy}" rx="11" ry="13" fill="#fff" stroke="${ink}" stroke-width="3"/><ellipse cx="${R}" cy="${cy}" rx="11" ry="13" fill="#fff" stroke="${ink}" stroke-width="3"/>
            <circle cx="${L+2}" cy="${cy+2}" r="5.5" fill="${ink}"/><circle cx="${R+2}" cy="${cy+2}" r="5.5" fill="${ink}"/>
            <path d="M${cx-13} ${cy+20} Q${cx-6} ${cy+27} ${cx} ${cy+21} Q${cx+6} ${cy+27} ${cx+13} ${cy+20}" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    }
  }
  return s;

  const b = BOSS[kind], id = 'bd'+(++__bid); let body = '', face = '', fx = '';
  if(kind==='SLIME'){
    face = bossFace(120,152,st,{gap:28, sleepy:st==='idle'});
    body = `<path d="M26 206 C22 150 60 98 120 94 C180 98 218 150 214 206 C180 218 60 218 26 206Z" fill="${b.body}"/>
      <path d="M26 206 C60 218 180 218 214 206 C212 196 210 190 208 184 C170 198 70 198 32 184 C30 190 28 196 26 206Z" fill="${b.dark}" opacity=".45"/>
      <ellipse cx="76" cy="136" rx="13" ry="22" fill="#fff" opacity=".55" transform="rotate(-25 76 136)"/>
      <circle cx="94" cy="112" r="5" fill="#fff" opacity=".55"/>
      <path d="M72 108 Q104 34 182 50 Q160 78 170 108 Z" fill="#6C7BD9"/>
      <path d="M96 76 Q128 60 166 66 M88 92 Q124 80 168 86" stroke="#AEB8F2" stroke-width="5" fill="none"/>
      <circle cx="186" cy="52" r="13" fill="#fff"/>
      <rect x="64" y="100" width="114" height="16" rx="8" fill="#fff"/>
      <ellipse cx="88" cy="${152+14}" rx="9" ry="5" fill="#FF8FA3" opacity=".5"/><ellipse cx="152" cy="${152+14}" rx="9" ry="5" fill="#FF8FA3" opacity=".5"/>`;
    if(st==='idle') fx = `<text x="196" y="112" font-family="Jua" font-size="26" fill="#6C7BD9">Z</text><text x="214" y="88" font-family="Jua" font-size="18" fill="#6C7BD9">z</text>`;
  } else if(kind==='GHOST'){
    face = bossFace(120,112,st,{gap:22});
    const w = 116/6; let wave = ''; for(let i=0;i<6;i++) wave += `q${-w/2} ${i%2?-12:12} ${-w} 0 `;
    body = `<ellipse cx="54" cy="140" rx="13" ry="22" fill="${b.body}" transform="rotate(${st==='attack'?-40:30} 54 140)"/>
      <ellipse cx="186" cy="140" rx="13" ry="22" fill="${b.body}" transform="rotate(${st==='attack'?40:-30} 186 140)"/>
      <path d="M62 198 V112 C62 72 90 46 120 46 C150 46 178 72 178 112 V198 ${wave}Z" fill="${b.body}"/>
      <path d="M150 58 C168 70 176 92 176 120" stroke="#fff" stroke-width="8" fill="none" opacity=".45" stroke-linecap="round"/>
      <ellipse cx="90" cy="130" rx="9" ry="5" fill="#FF8FA3" opacity=".5"/><ellipse cx="150" cy="130" rx="9" ry="5" fill="#FF8FA3" opacity=".5"/>`;
    if(st==='idle') fx = `<text x="22" y="72" font-family="Jua" font-size="34" fill="${b.dark}">?</text><text x="196" y="56" font-family="Jua" font-size="26" fill="${b.dark}">?</text><text x="204" y="190" font-family="Jua" font-size="20" fill="${b.dark}" opacity=".7">?</text>`;
  } else if(kind==='GOLEM'){
    face = bossFace(120,82,st,{gap:22, glow:true});
    const armY = st==='attack'?84:104;
    body = `<rect x="76" y="184" width="32" height="30" rx="10" fill="${b.dark}"/><rect x="132" y="184" width="32" height="30" rx="10" fill="${b.dark}"/>
      <rect x="54" y="98" width="132" height="100" rx="28" fill="${b.body}"/>
      <rect x="16" y="${armY}" width="44" height="74" rx="20" fill="${b.body}" stroke="${b.dark}" stroke-width="3"/>
      <rect x="180" y="${armY}" width="44" height="74" rx="20" fill="${b.body}" stroke="${b.dark}" stroke-width="3"/>
      <circle cx="38" cy="${armY+78}" r="18" fill="${b.dark}"/><circle cx="202" cy="${armY+78}" r="18" fill="${b.dark}"/>
      <rect x="72" y="42" width="96" height="72" rx="24" fill="${b.light}"/>
      <path d="M86 132 l14 14 -6 14 M160 120 l-12 10 4 16" stroke="${b.dark}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M82 50 q10 -14 26 -6 q12 -12 26 -2 q14 -8 24 6 q-4 8 -16 6 q-10 8 -22 2 q-12 6 -24 0 q-10 4 -14 -6z" fill="#7BC47F"/>
      <path d="M60 112 q8 -12 22 -6 q-2 10 -14 12z" fill="#7BC47F"/>
      <circle cx="120" cy="150" r="15" fill="${st==='defeated'?'#7C8391':'#FFD34D'}" stroke="${b.dark}" stroke-width="3"/>
      <path d="M113 150 l7 -8 7 8 -7 8z" fill="${st==='defeated'?'#A7ADB8':'#FFF3B0'}"/>`;
  } else {
    face = bossFace(120,86,st,{gap:22});
    body = `<path d="M160 186 C200 196 226 176 218 142" stroke="${b.body}" stroke-width="18" fill="none" stroke-linecap="round"/>
      <path d="M210 136 l18 -10 -4 20z" fill="${b.light}"/>
      <path d="M78 104 C40 70 18 84 14 112 C30 106 40 118 36 132 C52 122 62 132 66 144Z" fill="#C3A8F5" stroke="${b.dark}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M162 104 C200 70 222 84 226 112 C210 106 200 118 204 132 C188 122 178 132 174 144Z" fill="#C3A8F5" stroke="${b.dark}" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="88" cy="204" rx="18" ry="9" fill="${b.dark}"/><ellipse cx="152" cy="204" rx="18" ry="9" fill="${b.dark}"/>
      <ellipse cx="120" cy="160" rx="58" ry="48" fill="${b.body}"/>
      <ellipse cx="120" cy="170" rx="34" ry="32" fill="${b.light}"/>
      <path d="M94 160 h52 M92 174 h56 M98 188 h44" stroke="#E2CC93" stroke-width="3"/>
      <path d="M80 62 l-8 -30 24 20z M160 62 l8 -30 -24 20z" fill="#FFE8B0" stroke="#D9B86A" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="120" cy="90" rx="54" ry="46" fill="${b.body}"/>
      <path d="M100 48 l6 -10 6 10 M114 46 l6 -12 6 12 M128 48 l6 -10 6 10" fill="#FFE8B0" stroke="#D9B86A" stroke-width="2"/>
      <ellipse cx="86" cy="104" rx="8" ry="5" fill="#FF8FA3" opacity=".45"/><ellipse cx="154" cy="104" rx="8" ry="5" fill="#FF8FA3" opacity=".45"/>`;
    if(st==='attack') fx = `<path d="M96 116 C70 110 40 124 8 112 C26 130 18 140 4 150 C34 150 56 156 98 132 Z" fill="#FF8A3D" stroke="#E0592B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M94 122 C72 120 52 128 30 124 C44 134 40 140 32 146 C52 144 70 146 94 132 Z" fill="#FFD34D"/>`;
  }
  // 상태 효과
  let pre = '', post = fx, wrapT = '';
  if(st==='attack'){
    pre = `<ellipse cx="120" cy="128" rx="112" ry="104" fill="#F04438" opacity=".12"/>`;
    if(kind!=='DRAGON') post += `<g stroke="#F04438" stroke-width="5" stroke-linecap="round" opacity=".8"><path d="M6 96 h30"/><path d="M2 124 h40"/><path d="M8 152 h28"/></g>`;
    wrapT = 'translate(-6 0)';
  }
  if(st==='hurt'){
    wrapT = 'translate(8 4) rotate(4 120 200)';
    post += `<g transform="translate(46 60)"><polygon points="0,-34 9,-12 32,-18 16,0 34,16 10,14 4,36 -6,15 -30,22 -16,2 -34,-14 -10,-12" fill="#fff" stroke="#FFC233" stroke-width="4" stroke-linejoin="round"/></g>
      <g stroke="#FFC233" stroke-width="5" stroke-linecap="round"><path d="M200 50 l14 -12"/><path d="M210 80 l18 -2"/><path d="M196 24 l4 -16"/></g>`;
  }
  let filt = '';
  if(st==='defeated'){
    wrapT = 'translate(0 18) rotate(-10 120 210) scale(1 .94)';
    filt = `<filter id="${id}"><feColorMatrix type="saturate" values=".25"/></filter>`;
    post += `<g transform="translate(120 34)"><ellipse rx="56" ry="13" fill="none" stroke="#FFC233" stroke-width="3" stroke-dasharray="4 7" opacity=".9"/>
      ${[[-50,0],[0,12],[46,-4]].map(([x,y])=>`<path transform="translate(${x} ${y})" d="M0 -10 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#FFC233"/>`).join('')}</g>`;
  }
  const inner = `<g transform="${wrapT}" ${filt?`filter="url(#${id})"`:''}>${body}${face}</g>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><defs>${filt}</defs>${pre}${inner}${post}</svg>`;
}
